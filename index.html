<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptuAI - Smart Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #f3f4f6; padding: 15px; margin: 0; }
        .wrapper { max-width: 600px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #1e293b; padding-bottom: 15px; }
        h1 { color: #38bdf8; font-size: 24px; margin: 0 0 5px 0; }
        .badge { background: #0ea5e9; color: white; padding: 2px 8px; font-size: 11px; font-weight: bold; border-radius: 10px; text-transform: uppercase; }
        .control-panel { display: flex; align-items: center; justify-content: space-between; background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        button { background: #10b981; border: none; padding: 12px 24px; font-size: 15px; font-weight: bold; cursor: pointer; border-radius: 8px; color: white; transition: 0.2s; }
        .status-dot { width: 10px; height: 10px; background: #ef4444; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .status-container { display: flex; align-items: center; font-size: 14px; color: #9ca3af; }
        .card { background: #111827; border: 1px solid #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        h3 { margin-top: 0; font-size: 14px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; }
        #transcript-box { min-height: 60px; font-size: 16px; color: #e5e7eb; line-height: 1.5; }
        .detected-verse-card { border-left: 4px solid #38bdf8; background: #0f172a; padding: 12px; border-radius: 6px; margin-top: 10px; }
        .verse-title { font-weight: bold; color: #38bdf8; font-size: 18px; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .verse-text { font-style: italic; color: #cbd5e1; font-size: 15px; line-height: 1.4; }
        .send-btn { background: #38bdf8; padding: 6px 12px; font-size: 12px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <h1>ScriptuAI <span class="badge">Live</span></h1>
            <p style="margin:5px 0 0 0; color:#6b7280; font-size:14px;">Automated Scripture Projection System</p>
        </header>

        <div class="control-panel">
            <div class="status-container">
                <span id="dot" class="status-dot"></span>
                <span id="status">System Offline</span>
            </div>
            <button id="start-btn">🎙️ Connect Audio</button>
        </div>

        <div class="card">
            <h3>🔴 Live Audio Transcript</h3>
            <div id="transcript-box">Tap 'Connect Audio' and begin speaking...</div>
        </div>

        <div class="card">
            <h3>📺 Verified AI Detections</h3>
            <div id="detection-box">Listening for spoken scriptures...</div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status');
        const dot = document.getElementById('dot');
        const transcriptBox = document.getElementById('transcript-box');
        const detectionBox = document.getElementById('detection-box');

        // Extended list of common Bible books for matching
        const bibleBooks = [
            "genesis", "exodus", "leviticus", "numbers", "deuteronomy", "joshua", "judges", "ruth", 
            "1 samuel", "2 samuel", "1 kings", "2 kings", "1 chronicles", "2 chronicles", "ezra", "nehemiah", "esther", "job", "psalms", "psalm", "proverbs", "ecclesiastes", "song of solomon",
            "isaiah", "jeremiah", "lamentations", "ezekiel", "daniel", "hosea", "joel", "amos", "obadiah", "jonah", "micah", "nahum", "habakkuk", "zephaniah", "haggai", "zechariah", "malachi",
            "matthew", "mark", "luke", "john", "acts", "romans", "1 corinthians", "2 corinthians", "galatians", "ephesians", "philippians", "colossians", "1 thessalonians", "2 thessalonians", "1 timothy", "2 timothy", "titus", "philemon", "hebrews", "james", "1 peter", "2 peter", "1 john", "2 john", "3 john", "jude", "revelation"
        ];

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            alert("Speech recognition is not supported on this browser. Try Google Chrome.");
        } else {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            let isListening = false;

            startBtn.addEventListener('click', () => {
                if (!isListening) {
                    recognition.start();
                } else {
                    recognition.stop();
                }
            });

            recognition.onstart = () => {
                isListening = true;
                statusText.innerText = "System Listening Live...";
                dot.style.background = "#10b981";
                startBtn.innerText = "🛑 Disconnect";
                startBtn.style.background = "#ef4444";
                transcriptBox.innerText = "Say something like 'Open your Bibles to John chapter 3' or 'Look at Romans 8'...";
            };

            recognition.onend = () => {
                isListening = false;
                statusText.innerText = "System Offline";
                dot.style.background = "#ef4444";
                startBtn.innerText = "🎙️ Connect Audio";
                startBtn.style.background = "#10b981";
            };

            recognition.onresult = (event) => {
                let currentTranscript = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    currentTranscript += event.results[i].transcript;
                }
                
                transcriptBox.innerText = currentTranscript;
                parseLiveText(currentTranscript.toLowerCase());
            };
        }

        // Smart Regex Scanner: Finds any book followed by numbers
        function parseLiveText(text) {
            bibleBooks.forEach(book => {
                // Creates a flexible finder pattern for text like "John 3" or "John chapter 3"
                const regexPattern = new RegExp(`${book}\\s+(?:chapter\\s+)?(\\d+)`, 'g');
                let match = regexPattern.exec(text);
                
                if (match) {
                    let chapterNum = match[1];
                    let beautifulBookName = book.charAt(0).toUpperCase() + book.slice(1);
                    
                    // Display found match inside the clean interface card
                    detectionBox.innerHTML = `
                        <div class="detected-verse-card">
                            <div class="verse-title">
                                <span>📖 ${beautifulBookName} Chapter ${chapterNum}</span>
                                <button class="send-btn" onclick="alert('Sending to main projector screen!')">Push to Screen</button>
                            </div>
                            <div class="verse-text">System dynamically found a sermon reference to ${beautifulBookName} ${chapterNum}. Next step is downloading live verse data!</div>
                        </div>
                    `;
                }
            });
        }
    </script>
</body>
</html>
